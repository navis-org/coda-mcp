name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, against the deployed Coda build: this is what notices Coda changing under installed
  # servers, which no change in this repository would trigger.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          CODA_ARTIFACT: https://coda.science/mcp/v1/coda.js
